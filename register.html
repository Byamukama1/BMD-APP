    <style>
        /* ===== REGISTER SPECIFIC STYLES ===== */
        .register-container {
            max-width: 640px;
            margin: 0 auto;
            padding: 8px 16px 20px;
        }

        .form-card {
            background: #ffffff;
            border-radius: var(--radius-lg, 18px);
            box-shadow: var(--shadow-sm, 0 2px 8px rgba(0,0,0,0.05));
            padding: 20px 18px 24px;
            border: 1px solid var(--border-color, #e5e7eb);
            margin-top: 12px;
        }

        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary, #1f2937);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .page-title i {
            color: var(--accent-gold, #d4a743);
        }
        .page-sub {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 18px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--text-primary, #1f2937);
            margin-bottom: 3px;
        }

        .form-group label .required {
            color: #e74c3c;
            margin-left: 2px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid var(--border-color, #e5e7eb);
            border-radius: var(--radius-md, 12px);
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            background: #fcfcf9;
            transition: border 0.25s, box-shadow 0.25s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--accent-gold, #d4a743);
            box-shadow: 0 0 0 4px rgba(212, 167, 67, 0.12);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-row .form-group {
            margin-bottom: 0;
        }

        /* ===== IMAGE UPLOAD ===== */
        .image-upload-wrapper {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-top: 4px;
        }

        .image-preview {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #e8e0d4;
            border: 3px solid var(--accent-gold, #d4a743);
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #bbb;
            object-fit: cover;
        }

        .image-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-upload-btn {
            background: var(--text-primary, #1f2937);
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: var(--radius-md, 12px);
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.2s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .image-upload-btn:active {
            background: #374151;
        }

        .image-upload-btn .file-name {
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 400;
        }

        .hidden-input {
            display: none;
        }

        /* ===== SUBMIT ===== */
        .submit-area {
            margin-top: 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .submit-btn {
            background: var(--accent-gold, #d4a743);
            color: #111827;
            border: none;
            padding: 16px 24px;
            border-radius: var(--radius-md, 12px);
            font-size: 1.05rem;
            font-weight: 700;
            font-family: 'Playfair Display', serif;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.25s;
            box-shadow: 0 4px 16px rgba(212, 167, 67, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .submit-btn:active {
            transform: scale(0.97);
            box-shadow: 0 2px 8px rgba(212, 167, 67, 0.2);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .submit-btn i {
            font-size: 1.1rem;
        }

        .submit-status {
            font-size: 0.8rem;
            color: #888;
            text-align: center;
            padding: 4px 0;
            min-height: 24px;
        }

        .submit-status.error {
            color: #e74c3c;
        }
        .submit-status.success {
            color: #27ae60;
        }

        /* ===== PASSWORD HINT ===== */
        .password-hint {
            font-size: 0.7rem;
            color: #999;
            margin-top: 2px;
        }

        /* ===== FORGOT PASSWORD ===== */
        .forgot-password-link {
            text-align: center;
            margin-top: 12px;
            font-size: 0.85rem;
        }

        .forgot-password-link a {
            color: var(--accent-gold, #d4a743);
            font-weight: 600;
            cursor: pointer;
            text-decoration: underline;
        }

        /* ===== REGISTER OTHER ===== */
        .register-other-link {
            text-align: center;
            margin-top: 8px;
            font-size: 0.85rem;
            padding-top: 12px;
            border-top: 1px solid var(--border-color, #e5e7eb);
        }

        .register-other-link a {
            color: var(--accent-gold, #d4a743);
            font-weight: 600;
            cursor: pointer;
            text-decoration: underline;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .register-container {
                padding: 6px 10px 12px;
            }
            .form-card {
                padding: 14px 12px 18px;
            }
            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
            .form-row .form-group {
                margin-bottom: 14px;
            }
            .page-title {
                font-size: 1.2rem;
            }
            .image-upload-wrapper {
                flex-wrap: wrap;
            }
        }

        @media (min-width: 768px) {
            .register-container {
                padding: 12px 24px 30px;
            }
        }

        /* ===== SPINNER ===== */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

    <script>
        // ================================================================

        // ================================================================
        //  SETUP REGISTER FORM EVENTS
        // ================================================================
        function setupRegisterForm() {
            const form = document.getElementById('registerForm');
            const imageInput = document.getElementById('imageInput');
            const imagePreview = document.getElementById('imagePreview');
            const imageFileName = document.getElementById('imageFileName');
            const statusEl = document.getElementById('registerStatus');
            const submitBtn = document.getElementById('registerBtn');

            // Image upload
            document.getElementById('imageUploadBtn').addEventListener('click', () => {
                imageInput.click();
            });

            imageInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    imagePreview.innerHTML = `<img src="${event.target.result}" alt="Preview" />`;
                };
                reader.readAsDataURL(file);

                imageFileName.textContent = file.name;
                uploadImageToCloudinary(file);
            });

            // Sign In link
            document.getElementById('signInLink').addEventListener('click', () => {
                window.location.href = 'account.html';
            });

            // Register Other link
            document.getElementById('registerOtherLink').addEventListener('click', () => {
                showToast('📱 This feature is coming soon. Please contact BMD officials for assistance.', 4000);
            });

            // Form submit
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                await handleRegister(form, statusEl, submitBtn);
            });
        }

        // ================================================================
        //  IMAGE UPLOAD TO CLOUDINARY
        // ================================================================
        async function uploadImageToCloudinary(file) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', UPLOAD_PRESET);

            try {
                const response = await fetch(CLOUDINARY_URL, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error?.message || 'Upload failed');
                }

                const data = await response.json();
                uploadedImageUrl = data.secure_url;
                showToast('✅ Profile picture uploaded!', 2000);
            } catch (err) {
                console.error('Cloudinary upload error:', err);
                showToast('❌ Image upload failed: ' + err.message);
                uploadedImageUrl = null;
                document.getElementById('imagePreview').innerHTML = `<i class="fas fa-user"></i>`;
                document.getElementById('imageFileName').textContent = 'Choose Image';
                document.getElementById('imageInput').value = '';
            }
        }

        // ================================================================
        //  HANDLE REGISTER
        // ================================================================
        async function handleRegister(form, statusEl, submitBtn) {
            const fullName = document.getElementById('fullName').value.trim();
            const district = document.getElementById('district').value.trim();
            const subcounty = document.getElementById('subcounty').value.trim();
            const parish = document.getElementById('parish').value.trim();
            const village = document.getElementById('village').value.trim();
            const occupation = document.getElementById('occupation').value.trim();
            const phone1 = document.getElementById('phone1').value.trim();
            const phone2 = document.getElementById('phone2').value.trim();
            const phone3 = document.getElementById('phone3').value.trim();
            const role = document.getElementById('role').value.trim();
            const education = document.getElementById('education').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validation
            if (!fullName || !district || !subcounty || !parish || !village || !phone1) {
                statusEl.textContent = '⚠️ Please fill all required fields.';
                statusEl.className = 'submit-status error';
                return;
            }

            if (password.length < 6) {
                statusEl.textContent = '⚠️ Password must be at least 6 characters.';
                statusEl.className = 'submit-status error';
                return;
            }

            if (password !== confirmPassword) {
                statusEl.textContent = '⚠️ Passwords do not match.';
                statusEl.className = 'submit-status error';
                return;
            }

            const phoneDigits = phone1.replace(/\D/g, '');
            if (phoneDigits.length < 6) {
                statusEl.textContent = '⚠️ Please enter a valid phone number.';
                statusEl.className = 'submit-status error';
                return;
            }
            const email = phoneDigits + '@bmd.app';

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span> Creating account…';
            statusEl.textContent = '';
            statusEl.className = 'submit-status';

            try {
                // Check if phone already exists in Firestore
                const existingUser = await db.collection('users')
                    .where('phone', '==', phone1)
                    .get();

                if (!existingUser.empty) {
                    statusEl.textContent = '❌ You already have an account. Please sign in instead.';
                    statusEl.className = 'submit-status error';
                    showToast('You already have an account. Please sign in.', 4000);
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> Register';
                    return;
                }

                // Create auth user
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;

                // Update auth profile
                const updateData = { displayName: fullName };
                if (uploadedImageUrl) {
                    updateData.photoURL = uploadedImageUrl;
                }
                await user.updateProfile(updateData);

                // Save to Firestore
                const userDoc = {
                    uid: user.uid,
                    displayName: fullName,
                    district: district,
                    subcounty: subcounty,
                    parish: parish,
                    village: village,
                    occupation: occupation || '',
                    phone: phone1,
                    phone2: phone2 || '',
                    phone3: phone3 || '',
                    role: role || '',
                    education: education || '',
                    photoURL: uploadedImageUrl || user.photoURL || null,
                    email: email,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                };

                await db.collection('users').doc(user.uid).set(userDoc);

                statusEl.textContent = '✅ Registration successful! Redirecting…';
                statusEl.className = 'submit-status success';
                showToast('🎉 Welcome to BMD, ' + fullName + '!', 3000);

                setTimeout(() => {
                    window.location.href = 'account.html';
                }, 2000);

            } catch (err) {
                console.error('Registration error:', err);
                let errorMsg = err.message;
                if (err.code === 'auth/email-already-in-use') {
                    errorMsg = 'You already have an account. Please sign in.';
                }
                statusEl.textContent = '❌ ' + errorMsg;
                statusEl.className = 'submit-status error';
                showToast('Registration failed: ' + errorMsg, 4000);
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> Register';
            }
        }

        // ================================================================
        //  RENDER EXISTING USER PROFILE
        // ================================================================
        function renderExistingUser(user) {
            const photoURL = user.photoURL || 'https://res.cloudinary.com/dp81zzxlh/image/upload/v1/default-avatar.png';
            const displayName = user.displayName || 'BMD User';

            // Update header avatar

            }

            container.innerHTML = `
                <div class="form-card">
                    <div class="page-title">
                        <i class="fas fa-check-circle" style="color:var(--accent-gold);"></i> You're Already Registered
                    </div>
                    <div class="page-sub">Welcome back, ${displayName}!</div>

                    <div style="display:flex; align-items:center; gap:16px; padding:16px 0; border-bottom:1px solid var(--border-color); margin-bottom:16px;">
                        <img src="${photoURL}" style="width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid var(--accent-gold);" />
                        <div>
                            <div style="font-weight:700; font-size:1.1rem;">${displayName}</div>
                            <div style="color:#888; font-size:0.85rem;">${user.phone || user.email || ''}</div>
                        </div>
                    </div>

                    <div style="display:flex; flex-direction:column; gap:10px;">
                        <a href="account.html" class="submit-btn" style="text-decoration:none; text-align:center;">
                            <i class="fas fa-user-circle"></i> Go to My Account
                        </a>
                        <button class="image-upload-btn" id="editProfileBtn" style="justify-content:center; background:var(--accent-gold); color:#111827; width:100%; padding:12px;">
                            <i class="fas fa-edit"></i> Edit Profile
                        </button>
                        <button class="image-upload-btn" id="registerOtherBtn" style="justify-content:center; background:var(--text-primary); color:#fff; width:100%; padding:12px;">
                            <i class="fas fa-user-plus"></i> Register for Someone Else
                        </button>
                        <button class="image-upload-btn" id="forgotPasswordBtn" style="justify-content:center; background:#e74c3c; color:#fff; width:100%; padding:12px;">
                            <i class="fas fa-key"></i> Forgot Password
                        </button>
                        <div class="forgot-password-link" style="border-top:none; padding-top:0;">
                            <a id="signOutLink" style="color:#e74c3c;">Sign Out</a>
                        </div>
                    </div>
                </div>
            `;

            // Events
            document.getElementById('editProfileBtn').addEventListener('click', () => {
                window.location.href = 'account.html';
            });

            document.getElementById('registerOtherBtn').addEventListener('click', () => {
                showToast('📱 This feature is coming soon. Please contact BMD officials for assistance.', 4000);
            });

            document.getElementById('forgotPasswordBtn').addEventListener('click', () => {
                const phone = user.phone || '';
                const message = encodeURIComponent(
                    `I forgot my password on BMD app. My phone number is ${phone}. Please help me reset it.`
                );
                window.open(`https://wa.me/256761828694?text=${message}`, '_blank');
            });

            document.getElementById('signOutLink').addEventListener('click', async () => {
                try {
                    await auth.signOut();
                    showToast('Signed out successfully.');
                    renderRegisterForm();
                } catch (err) {
                    showToast('Error signing out: ' + err.message);
                }
            });
        }

        // ================================================================
        //  AUTH STATE LISTENER
        // ================================================================
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                try {
                    // Fetch user data from Firestore
                    const doc = await db.collection('users').doc(user.uid).get();
                    if (doc.exists) {
                        const userData = doc.data();
                        // Merge auth and Firestore data
                        const mergedUser = {
                            ...user,
                            ...userData,
                            phone: userData.phone || ''
                        };
                        renderExistingUser(mergedUser);
                    } else {
                        // User exists in auth but not in Firestore - show register form
                        renderRegisterForm();
                    }
                } catch (err) {
                    console.error('Error fetching user data:', err);
                    renderRegisterForm();
                }
            } else {
                // Not logged in - show register form
                renderRegisterForm();
            }
        });

        // ================================================================
        //  NAVIGATION (same as index)
        // ================================================================
        document.querySelectorAll('.bottom-nav .nav-item').forEach(item => {
            item.addEventListener('click', () => {
                const tab = item.dataset.tab;
                document.querySelectorAll('.bottom-nav .nav-item').forEach(n => n.classList.remove('active'));
                item.classList.add('active');

                switch (tab) {
                    case 'home':
                        window.location.href = 'index.html';
                        break;
                    case 'register':
                        break;
                    case 'activities':
                        showToast('📅 Activities page coming soon!');
                        break;
                    case 'post':
                        window.location.href = 'post.html';
                        break;
                    case 'account':
                        window.location.href = 'account.html';
                        break;
                    default:
                        break;
                }
            });
        });

        // Header avatar click -> account
        headerAvatar.addEventListener('click', () => {
            window.location.href = 'account.html';
        });

        // ================================================================
        //  INIT
        // ================================================================
        console.log('📝 BMD Registration page loaded.');
        console.log('☁️ Cloudinary preset:', UPLOAD_PRESET);
        console.log('📁 User data stored in Firestore "users" collection.');
    </script>
</body>
</html>
