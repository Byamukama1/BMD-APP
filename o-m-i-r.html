    <style>
        /* ===== O-M-I-R SPECIFIC STYLES ===== */
        .omir-container {
            max-width: 640px;
            margin: 0 auto;
            padding: 8px 16px 20px;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding: 12px 16px;
            background: #ffffff;
            border-radius: var(--radius-lg, 18px);
            box-shadow: var(--shadow-sm, 0 2px 8px rgba(0,0,0,0.05));
            border: 1px solid var(--border-color, #e5e7eb);
        }

        .page-header .title {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary, #1f2937);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-header .title i {
            color: var(--accent-gold, #d4a743);
        }

        .page-header .member-count {
            font-size: 0.8rem;
            color: #888;
            background: #f3f4f6;
            padding: 4px 12px;
            border-radius: 20px;
        }

        /* ===== MEMBER CARD ===== */
        .member-card {
            background: #ffffff;
            border-radius: var(--radius-lg, 18px);
            margin-bottom: 16px;
            box-shadow: var(--shadow-sm, 0 2px 8px rgba(0,0,0,0.05));
            border: 1px solid var(--border-color, #e5e7eb);
            overflow: hidden;
            transition: box-shadow 0.2s ease, transform 0.15s ease;
        }

        .member-card:hover {
            box-shadow: var(--shadow-md, 0 6px 20px rgba(0,0,0,0.08));
        }

        .member-card .member-body {
            padding: 16px;
        }

        .member-card .member-top {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 12px;
        }

        .member-card .member-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            background: #e5e7eb;
            border: 2px solid var(--accent-gold, #d4a743);
            flex-shrink: 0;
        }

        .member-card .member-avatar .no-photo {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e5e7eb;
            color: #999;
            font-size: 1.8rem;
        }

        .member-card .member-info {
            flex: 1;
            min-width: 0;
        }

        .member-card .member-name {
            font-family: 'Lora', serif;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-primary, #1f2937);
            margin-bottom: 2px;
        }

        .member-card .member-details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 16px;
            font-size: 0.78rem;
            color: #555;
            margin-top: 4px;
        }

        .member-card .member-details-grid .detail-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .member-card .member-details-grid .detail-item i {
            width: 14px;
            color: var(--accent-gold, #d4a743);
            font-size: 0.7rem;
        }

        .member-card .member-details-grid .detail-item .label {
            color: #999;
            font-weight: 500;
        }

        .member-card .member-badge {
            display: inline-block;
            font-size: 0.6rem;
            font-weight: 600;
            padding: 3px 12px;
            border-radius: 12px;
            background: #e8f5e9;
            color: #2e7d32;
            margin-top: 6px;
        }

        .member-card .member-badge.other {
            background: #e3f2fd;
            color: #1565c0;
        }

        .member-card .member-actions {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            border-top: 1px solid #f3f4f6;
            background: #fafafa;
            flex-wrap: wrap;
        }

        .member-card .member-actions .btn-action {
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary, #4b5563);
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 20px;
            transition: background 0.15s, color 0.15s;
            font-family: inherit;
        }

        .member-card .member-actions .btn-action:hover {
            background: #f3f4f6;
        }

        .member-card .member-actions .btn-action i {
            font-size: 0.9rem;
        }

        .member-card .member-actions .btn-action.view-btn {
            color: #3b82f6;
        }

        .member-card .member-actions .btn-action.edit-btn {
            color: var(--accent-gold, #d4a743);
        }

        .member-card .member-actions .btn-action.delete-btn {
            color: #e74c3c;
        }

        .member-card .member-actions .btn-action:active {
            transform: scale(0.95);
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
            background: #ffffff;
            border-radius: var(--radius-lg, 18px);
            border: 1px solid var(--border-color, #e5e7eb);
        }

        .empty-state i {
            font-size: 3rem;
            color: #ccc;
            margin-bottom: 12px;
        }

        .empty-state h3 {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 4px;
        }

        .empty-state p {
            font-size: 0.85rem;
            color: #999;
        }

        .empty-state .register-btn {
            display: inline-block;
            margin-top: 16px;
            padding: 10px 24px;
            background: var(--accent-gold, #d4a743);
            color: #111827;
            border-radius: var(--radius-md, 12px);
            text-decoration: none;
            font-weight: 600;
            font-family: inherit;
            transition: background 0.2s;
        }

        .empty-state .register-btn:hover {
            background: var(--accent-gold-hover, #f0d080);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .omir-container {
                padding: 6px 10px 12px;
            }
            .page-header {
                padding: 10px 14px;
                flex-direction: column;
                gap: 6px;
                text-align: center;
            }
            .page-header .title {
                font-size: 1rem;
            }
            .member-card .member-top {
                flex-direction: column;
                text-align: center;
            }
            .member-card .member-avatar {
                width: 70px;
                height: 70px;
            }
            .member-card .member-details-grid {
                grid-template-columns: 1fr;
                text-align: center;
            }
            .member-card .member-details-grid .detail-item {
                justify-content: center;
            }
            .member-card .member-actions {
                padding: 10px 12px;
                justify-content: center;
            }
            .member-card .member-actions .btn-action {
                font-size: 0.7rem;
                padding: 4px 8px;
            }
        }

        @media (min-width: 768px) {
            .omir-container {
                padding: 12px 24px 30px;
            }
        }

        /* Spinner */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s ease-in-out infinite;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== LOADING SKELETON ===== */
        .skeleton {
            background: #e8e0d4;
            border-radius: var(--radius-lg);
            padding: 16px;
            margin-bottom: 16px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .skeleton .skeleton-row {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .skeleton .skeleton-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #d5cdc0;
            flex-shrink: 0;
        }

        .skeleton .skeleton-lines {
            flex: 1;
        }

        .skeleton .skeleton-line {
            height: 12px;
            background: #d5cdc0;
            border-radius: 6px;
            margin-bottom: 6px;
        }

        .skeleton .skeleton-line.short {
            width: 40%;
        }
        .skeleton .skeleton-line.med {
            width: 60%;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #111827;
            color: #fff;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.8rem;
            opacity: 0;
            transition: all 0.3s;
            z-index: 5000;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>

    <!-- ===== FIREBASE + APP LOGIC ===== -->

    <script>
        // ================================================================
        //  FIREBASE CONFIG
        // ================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyC-PINF2AJcETYIMINiCfT0gSxLxw70vSE",
            authDomain: "bmd-app-1aec8.firebaseapp.com",
            projectId: "bmd-app-1aec8",
            storageBucket: "bmd-app-1aec8.firebasestorage.app",
            messagingSenderId: "722780031230",
            appId: "1:722780031230:web:cd19a98e24e4d9d80dfdaf",
            measurementId: "G-WPEG8SQSW7"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const db = firebase.firestore();
        const auth = firebase.auth();

        // ================================================================
        //  DOM REFS
        // ================================================================
        const membersWrapper = document.getElementById('membersWrapper');
        const memberCount = document.getElementById('memberCount');
        const headerAvatar = document.getElementById('headerAvatar');
        const toast = document.getElementById('toast');

        let currentUser = null;
        let allMembers = [];

        // ================================================================
        //  TOAST
        // ================================================================
        let toastTimer = null;

        function showToast(msg, duration = 2800) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), duration);
        }

        // ================================================================
        //  AUTH STATE LISTENER
        // ================================================================
        auth.onAuthStateChanged(async (user) => {
            currentUser = user;

            if (!user) {
                showToast('Please sign in to view registered members.', 3000);
                setTimeout(() => {
                    window.location.href = 'account.html';
                }, 2000);
                return;
            }

            // Update header avatar
            try {
                const userDoc = await db.collection('users').doc(user.uid).get();
                if (userDoc.exists && userDoc.data().photoURL) {
                    headerAvatar.innerHTML = `<img src="${userDoc.data().photoURL}" style="width:100%;height:100%;object-fit:cover;" />`;
                } else if (user.photoURL) {
                    headerAvatar.innerHTML = `<img src="${user.photoURL}" style="width:100%;height:100%;object-fit:cover;" />`;
                }
            } catch (e) {
                console.error("Error fetching user profile:", e);
            }

            // Load members registered by this user (only "other" members)
            loadRegisteredMembers(user.uid);
        });

        // ================================================================
        //  LOAD REGISTERED MEMBERS
        // ================================================================
        function loadRegisteredMembers(uid) {
            // Query: only "other" members where registeredBy == current user
            db.collection('users')
                .where('registeredBy', '==', uid)
                .where('isOther', '==', true)
                .orderBy('createdAt', 'desc')
                .onSnapshot(snapshot => {
                    allMembers = [];
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        allMembers.push({
                            id: doc.id,
                            ...data,
                            createdAt: data.createdAt ? data.createdAt.toDate() : new Date()
                        });
                    });
                    renderMembers(allMembers);
                }, error => {
                    console.error("Error loading members:", error);
                    showToast('Failed loading members. Please refresh.');
                    membersWrapper.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-triangle"></i>
                            <h3>Error Loading Members</h3>
                            <p>Please refresh the page to try again.</p>
                        </div>
                    `;
                });
        }

        // ================================================================
        //  RENDER MEMBERS
        // ================================================================
        function renderMembers(members) {
            memberCount.textContent = members.length + ' member' + (members.length !== 1 ? 's' : '');

            if (!members.length) {
                membersWrapper.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-users"></i>
                        <h3>No Members Registered</h3>
                        <p>You have not registered any other members yet.</p>
                        <a href="register.html" class="register-btn">
                            <i class="fas fa-user-plus"></i> Register Member
                        </a>
                    </div>
                `;
                return;
            }

            let html = '';
            members.forEach(member => {
                const displayName = member.displayName || 'Unknown Member';
                const phone = member.phone || 'No phone';
                const village = member.village || 'N/A';
                const parish = member.parish || 'N/A';
                const subcounty = member.subcounty || 'N/A';
                const district = member.district || 'N/A';
                const role = member.role || 'N/A';
                const photoURL = member.photoURL || null;
                const dateStr = member.createdAt ? member.createdAt.toLocaleDateString() : '';
                const registeredByName = member.registeredByName || 'You';

                let avatarHtml = '';
                if (photoURL) {
                    avatarHtml = `<img src="${photoURL}" alt="${displayName}" class="member-avatar" />`;
                } else {
                    avatarHtml = `
                        <div class="member-avatar no-photo">
                            <i class="fas fa-user"></i>
                        </div>
                    `;
                }

                html += `
                    <div class="member-card" data-id="${member.id}">
                        <div class="member-body">
                            <div class="member-top">
                                ${avatarHtml}
                                <div class="member-info">
                                    <div class="member-name">${escapeHtml(displayName)}</div>
                                    <div class="member-details-grid">
                                        <div class="detail-item"><i class="fas fa-phone"></i> ${escapeHtml(phone)}</div>
                                        <div class="detail-item"><i class="fas fa-location-dot"></i> ${escapeHtml(village)}, ${escapeHtml(parish)}</div>
                                        <div class="detail-item"><i class="fas fa-map-pin"></i> ${escapeHtml(subcounty)}, ${escapeHtml(district)}</div>
                                        <div class="detail-item"><i class="fas fa-user-tag"></i> ${escapeHtml(role)}</div>
                                        <div class="detail-item"><i class="fas fa-calendar"></i> ${dateStr}</div>
                                    </div>
                                    <span class="member-badge other">
                                        <i class="fas fa-check-circle"></i> Registered by you
                                    </span>
                                    ${registeredByName ? `<span style="font-size:0.6rem; color:#999; background:#f3f4f6; padding:2px 10px; border-radius:12px; margin-left:6px;"><i class="fas fa-user-plus"></i> by ${escapeHtml(registeredByName)}</span>` : ''}
                                </div>
                            </div>
                        </div>
                        <div class="member-actions">
                            <button class="btn-action view-btn" onclick="viewMember('${member.id}')">
                                <i class="fas fa-eye"></i> View
                            </button>
                            <button class="btn-action edit-btn" onclick="editMember('${member.id}')">
                                <i class="fas fa-edit"></i> Edit
                            </button>
                            <button class="btn-action delete-btn" onclick="removeMember('${member.id}')">
                                <i class="fas fa-user-minus"></i> Remove
                            </button>
                        </div>
                    </div>
                `;
            });

            membersWrapper.innerHTML = html;
        }

        // ================================================================
        //  VIEW MEMBER
        // ================================================================
        function viewMember(id) {
            const member = allMembers.find(m => m.id === id);
            if (!member) return;

            const msg = encodeURIComponent(
                `📋 MEMBER DETAILS\n` +
                `━━━━━━━━━━━━━━━━━━━━━\n` +
                `👤 Name: ${member.displayName || 'N/A'}\n` +
                `📱 Phone: ${member.phone || 'N/A'}\n` +
                `📍 Village: ${member.village || 'N/A'}\n` +
                `📍 Parish: ${member.parish || 'N/A'}\n` +
                `📍 Subcounty: ${member.subcounty || 'N/A'}\n` +
                `📍 District: ${member.district || 'N/A'}\n` +
                `👔 Role: ${member.role || 'N/A'}\n` +
                `📅 Registered: ${member.createdAt ? member.createdAt.toLocaleDateString() : 'N/A'}\n` +
                `━━━━━━━━━━━━━━━━━━━━━\n` +
                `Registered by: ${member.registeredByName || 'You'}`
            );
            window.open(`https://wa.me/256761828694?text=${msg}`, '_blank');
        }

        // ================================================================
        //  EDIT MEMBER
        // ================================================================
        function editMember(id) {
            window.location.href = 'register.html?edit=' + id;
        }

        // ================================================================
        //  REMOVE MEMBER (from your list only - does not delete document)
        // ================================================================
        async function removeMember(id) {
            if (!confirm('Remove this member from your list?')) return;

            try {
                await db.collection('users').doc(id).update({
                    registeredBy: null,
                    registeredByName: null
                });
                showToast('✅ Member removed from your list.');
            } catch (err) {
                console.error('Remove error:', err);
                showToast('❌ Failed to remove member: ' + err.message);
            }
        }

        // ================================================================
        //  NAVIGATION
        // ================================================================
        document.querySelectorAll('.bottom-nav .nav-item').forEach(item => {
            item.addEventListener('click', () => {
                const tab = item.dataset.tab;
                document.querySelectorAll('.bottom-nav .nav-item').forEach(n => n.classList.remove('active'));
                item.classList.add('active');

                switch (tab) {
                    case 'home':
                        window.location.href = 'index.html';
                        break;
                    case 'register':
                        window.location.href = 'register.html';
                        break;
                    case 'activities':
                        showToast('📅 Activities page coming soon!');
                        break;
                    case 'post':
                        window.location.href = 'post.html';
                        break;
                    case 'account':
                        window.location.href = 'account.html';
                        break;
                    default:
                        break;
                }
            });
        });

        // ================================================================
        //  BACK BUTTON
        // ================================================================
        document.getElementById('backBtn').addEventListener('click', () => {
            window.location.href = 'account.html';
        });

        // Header avatar click -> account
