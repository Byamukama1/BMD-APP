<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Buhweju Must Develop – BMD</title>

    <!-- OG meta (will be updated dynamically) -->
    <meta property="og:title" content="Buhweju Must Develop (BMD)" />
    <meta property="og:description" content="Eiraka ryabantu baburijo. – People's Voice" />
    <meta property="og:image" content="https://res.cloudinary.com/dp81zzxlh/image/upload/v1784978097/vhaafrigchmqnqbhehft.jpg" />
    <meta property="og:url" content="https://bmd-app-1aec8.web.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Buhweju Must Develop" />

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />

    <style>
        * { margin:0; padding:0; box-sizing:border-box; }

        :root {
            --bmd-white: #ffffff;
            --bmd-black: #111111;
            --bmd-grey: #f5f5f5;
            --bmd-grey-dark: #2c2c2c;
            --bmd-gold: #d4a743;
            --bmd-gold-light: #f0d080;
            --bmd-shadow: 0 4px 16px rgba(0,0,0,0.06);
            --bmd-radius: 20px;
            --bmd-radius-sm: 12px;
            --nav-height: 70px;
            --header-height: 68px;
            --ad-height: 34px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bmd-grey);
            color: var(--bmd-black);
            padding-bottom: calc(var(--nav-height) + 20px);
            padding-top: calc(var(--header-height) + var(--ad-height) + 8px);
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        /* ----- HEADER (black/white/gold) ----- */
        .app-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: #ffffff;
            border-bottom: 1px solid rgba(0,0,0,0.06);
            height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
        }

        .app-header .left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .app-header .logo-img {
            height: 40px;
            width: auto;
            border-radius: 8px;
            background: #fff;
            object-fit: contain;
        }

        .app-header .brand-text {
            display: flex;
            flex-direction: column;
            line-height: 1.15;
        }
        .app-header .brand-text .main {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: #111;
            letter-spacing: -0.3px;
        }
        .app-header .brand-text .sub {
            font-size: 0.55rem;
            font-weight: 500;
            color: #777;
            letter-spacing: 0.2px;
            text-transform: uppercase;
        }

        .app-header .right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .app-header .right .search-icon {
            font-size: 1.25rem;
            color: #333;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .app-header .right .search-icon:active { transform: scale(0.90); }

        .app-header .profile-pic {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--bmd-gold);
            background: #ddd;
            cursor: pointer;
            transition: border 0.2s;
        }
        .app-header .profile-pic:active { opacity: 0.7; }

        /* ----- MOVING AD (gold/black) ----- */
        .marquee-ad {
            position: fixed;
            top: var(--header-height);
            left: 0;
            right: 0;
            z-index: 999;
            height: var(--ad-height);
            background: #1a1a1a;
            color: #f0e6d0;
            font-size: 0.7rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            overflow: hidden;
            border-bottom: 1px solid var(--bmd-gold);
        }

        .marquee-ad .marquee-track {
            display: flex;
            white-space: nowrap;
            animation: marqueeScroll 20s linear infinite;
        }
        .marquee-ad .marquee-track span { padding: 0 60px; letter-spacing: 0.4px; }
        .marquee-ad .marquee-track i { color: var(--bmd-gold); margin-right: 6px; }

        @keyframes marqueeScroll {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-50%); }
        }

        /* ----- SEARCH OVERLAY (black/white) ----- */
        .search-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 2000;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(6px);
            display: none;
            align-items: flex-start;
            justify-content: center;
            padding: 80px 20px 30px;
        }
        .search-overlay.active { display: flex; }

        .search-overlay .search-box {
            width: 100%;
            max-width: 480px;
            background: #fff;
            border-radius: var(--bmd-radius);
            padding: 16px 20px 20px;
            box-shadow: 0 12px 48px rgba(0,0,0,0.3);
            animation: slideUp 0.25s ease;
        }
        @keyframes slideUp {
            0% { opacity:0; transform: translateY(30px) scale(0.96); }
            100% { opacity:1; transform: translateY(0) scale(1); }
        }

        .search-overlay .search-box .close-btn {
            text-align: right;
            font-size: 1.4rem;
            color: #888;
            cursor: pointer;
            margin-bottom: 4px;
        }
        .search-overlay .search-box input {
            width: 100%;
            padding: 12px 16px;
            font-size: 1rem;
            border: 2px solid #ddd;
            border-radius: var(--bmd-radius-sm);
            outline: none;
            font-family: inherit;
            transition: border 0.2s;
        }
        .search-overlay .search-box input:focus { border-color: #111; }

        .search-overlay .search-box .results {
            margin-top: 14px;
            max-height: 50vh;
            overflow-y: auto;
        }
        .search-overlay .search-box .results .result-item {
            padding: 10px 12px;
            border-radius: var(--bmd-radius-sm);
            background: #f5f0e8;
            margin-bottom: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.15s;
        }
        .search-overlay .search-box .results .result-item:active { background: #e8e0d4; }
        .search-overlay .search-box .results .result-item img {
            width: 44px; height: 44px; object-fit: cover; border-radius: 8px;
            background: #ddd; flex-shrink: 0;
        }
        .search-overlay .search-box .results .result-item .info {
            flex:1; min-width:0;
        }
        .search-overlay .search-box .results .result-item .info .title {
            font-weight: 600; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .search-overlay .search-box .results .result-item .info .preview {
            font-size: 0.75rem; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .search-overlay .search-box .results .empty {
            text-align: center; color: #888; padding: 30px 0; font-size: 0.9rem;
        }

        /* ----- FEED ----- */
        .feed {
            max-width: 680px;
            margin: 0 auto;
            padding: 6px 14px 20px;
        }

        /* ----- POST CARD (clean, professional) ----- */
        .post-card {
            background: #ffffff;
            border-radius: var(--bmd-radius);
            margin-bottom: 20px;
            box-shadow: var(--bmd-shadow);
            overflow: hidden;
            transition: transform 0.15s, box-shadow 0.2s;
            border: 1px solid rgba(0,0,0,0.02);
            cursor: default;
        }
        .post-card:active { transform: scale(0.995); }

        .post-card .card-body {
            padding: 16px 18px 8px;
        }

        .post-card .post-author {
            font-size: 0.8rem;
            font-weight: 600;
            color: #555;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 2px;
        }
        .post-card .post-author i {
            color: var(--bmd-gold);
            font-size: 0.7rem;
        }
        .post-card .post-author .name {
            color: #222;
        }
        .post-card .post-author .date {
            font-weight: 400;
            color: #999;
            font-size: 0.65rem;
        }

        .post-card .post-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: #111;
            line-height: 1.3;
            margin-bottom: 6px;
        }

        .post-card .card-media {
            margin: 8px 0 0;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: var(--bmd-radius-sm);
        }
        .post-card .card-media img {
            width: 100%;
            height: auto;
            max-height: 320px;
            object-fit: cover;
            display: block;
        }
        .post-card .card-media .media-badge {
            display: none;
        }

        .post-card .media-player {
            margin-top: 6px;
            border-radius: var(--bmd-radius-sm);
            overflow: hidden;
            background: #1a1a1a;
        }
        .post-card .media-player audio,
        .post-card .media-player video {
            width: 100%;
            display: block;
            max-height: 200px;
        }

        .post-card .post-preview {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #2d2d2d;
            margin: 10px 0 6px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .post-card .post-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 18px 14px;
            border-top: 1px solid #f0ebe4;
            flex-wrap: wrap;
            gap: 6px;
        }
        .post-card .post-actions .left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .post-card .post-actions .action-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #555;
            background: none;
            border: none;
            padding: 4px 8px;
            border-radius: 30px;
            cursor: pointer;
            transition: background 0.15s;
            font-family: inherit;
        }
        .post-card .post-actions .action-btn:active { transform: scale(0.92); }
        .post-card .post-actions .action-btn i { font-size: 1.1rem; }
        .post-card .post-actions .action-btn.liked { color: #d93025; }
        .post-card .post-actions .action-btn.liked i { font-weight: 900; }
        .post-card .post-actions .action-btn .count {
            font-size: 0.7rem;
            font-weight: 600;
            color: #777;
            min-width: 12px;
        }
        .post-card .post-actions .read-more {
            font-size: 0.75rem;
            font-weight: 600;
            color: #111;
            background: rgba(0,0,0,0.04);
            padding: 4px 16px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.15s;
        }
        .post-card .post-actions .read-more:active { background: rgba(0,0,0,0.10); }

        /* Share modal (simple) */
        .share-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 3000;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
        }
        .share-modal.active { display: flex; }
        .share-modal .share-box {
            background: #fff;
            border-radius: var(--bmd-radius);
            padding: 24px 20px 28px;
            max-width: 340px;
            width: 100%;
            animation: slideUp 0.25s ease;
            box-shadow: 0 20px 48px rgba(0,0,0,0.3);
        }
        .share-modal .share-box h3 {
            font-family: 'Playfair Display', serif;
            margin-bottom: 16px;
            font-weight: 600;
            color: #111;
        }
        .share-modal .share-box .share-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }
        .share-modal .share-box .share-grid button {
            background: #f5f5f5;
            border: none;
            border-radius: 60px;
            padding: 10px 18px;
            font-size: 0.85rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: background 0.15s;
            font-family: inherit;
        }
        .share-modal .share-box .share-grid button:active { background: #e0e0e0; }
        .share-modal .share-box .share-grid button i { font-size: 1.2rem; }
        .share-modal .share-box .close-share {
            margin-top: 16px;
            width: 100%;
            padding: 10px;
            background: #eee;
            border: none;
            border-radius: 60px;
            font-weight: 500;
            cursor: pointer;
        }

        /* ----- FULL POST OVERLAY (modal) ----- */
        .full-post-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 3000;
            background: rgba(0,0,0,0.70);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px 12px 30px;
            overflow-y: auto;
        }
        .full-post-overlay.active { display: flex; }

        .full-post-overlay .full-post-content {
            background: #fff;
            border-radius: var(--bmd-radius);
            max-width: 640px;
            width: 100%;
            max-height: 92vh;
            overflow-y: auto;
            padding: 20px 20px 30px;
            animation: slideUp 0.3s ease;
            position: relative;
            box-shadow: 0 24px 64px rgba(0,0,0,0.4);
        }
        .full-post-overlay .full-post-content .close-full {
            position: sticky;
            top: 0;
            z-index: 1;
            text-align: right;
            font-size: 1.6rem;
            color: #999;
            cursor: pointer;
            margin-bottom: 6px;
            background: #fff;
            padding: 4px 0 8px;
            border-bottom: 1px solid #eee;
        }
        .full-post-overlay .full-post-content .full-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: #111;
            margin: 4px 0 6px;
            line-height: 1.3;
        }
        .full-post-overlay .full-post-content .full-meta {
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 12px;
        }
        .full-post-overlay .full-post-content .full-image {
            width: 100%;
            border-radius: var(--bmd-radius-sm);
            margin: 8px 0 14px;
            background: #ddd;
            max-height: 400px;
            object-fit: cover;
        }
        .full-post-overlay .full-post-content .full-text {
            font-size: 0.95rem;
            line-height: 1.8;
            color: #1e1e1e;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .full-post-overlay .full-post-content .full-text p { margin-bottom: 12px; }
        .full-post-overlay .full-post-content .full-media {
            margin: 12px 0;
            border-radius: var(--bmd-radius-sm);
            overflow: hidden;
            background: #1a1a1a;
        }
        .full-post-overlay .full-post-content .full-media audio,
        .full-post-overlay .full-post-content .full-media video {
            width: 100%;
            display: block;
            max-height: 360px;
        }
        .full-post-overlay .full-post-content .full-actions {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid #f0ebe4;
        }

        /* ----- BOTTOM NAV (black/white) ----- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            height: var(--nav-height);
            background: #ffffff;
            border-top: 1px solid rgba(0,0,0,0.06);
            box-shadow: 0 -4px 16px rgba(0,0,0,0.04);
            display: flex;
            align-items: stretch;
            justify-content: space-around;
            padding: 0 4px;
        }
        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            gap: 1px;
            font-size: 0.5rem;
            font-weight: 500;
            color: #888;
            cursor: pointer;
            transition: color 0.15s;
            padding: 4px 0;
            border: none;
            background: none;
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
        }
        .bottom-nav .nav-item i {
            font-size: 1.3rem;
            transition: transform 0.2s;
        }
        .bottom-nav .nav-item:active i { transform: scale(0.88); }
        .bottom-nav .nav-item.active { color: #111; }
        .bottom-nav .nav-item.active i { color: var(--bmd-gold); }
        .bottom-nav .nav-item .label {
            font-size: 0.5rem;
            letter-spacing: 0.2px;
            text-transform: uppercase;
        }
        .bottom-nav .nav-item.post-btn i {
            font-size: 2rem;
            color: var(--bmd-gold);
            background: #111;
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            margin-top: -16px;
            transition: transform 0.2s;
        }
        .bottom-nav .nav-item.post-btn:active i { transform: scale(0.92); }
        .bottom-nav .nav-item.post-btn .label { margin-top: 2px; }

        /* ----- TOAST ----- */
        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #1e1e1e;
            color: #fff;
            padding: 10px 24px;
            border-radius: 60px;
            font-size: 0.85rem;
            font-weight: 500;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s, transform 0.3s;
            z-index: 5000;
            max-width: 90%;
            text-align: center;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ----- LOADING / SKELETON ----- */
        .skeleton {
            background: #e8e0d4;
            border-radius: var(--bmd-radius);
            padding: 16px;
            margin-bottom: 20px;
            animation: pulse 1.5s ease-in-out infinite;
        }
        .skeleton .s-image {
            height: 180px;
            background: #d5cdc0;
            border-radius: var(--bmd-radius-sm);
            margin-bottom: 12px;
        }
        .skeleton .s-line {
            height: 14px;
            background: #d5cdc0;
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .skeleton .s-line.short { width: 60%; }
        .skeleton .s-line.med { width: 80%; }
        @keyframes pulse {
            0%,100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }
        .empty-state i { font-size: 3rem; color: #ccc; margin-bottom: 12px; }
        .empty-state h3 { font-size: 1.1rem; color: #555; }
        .empty-state p { font-size: 0.85rem; color: #999; }

        /* responsive */
        @media (max-width: 480px) {
            .app-header .brand-text .main { font-size: 0.9rem; }
            .app-header .logo-img { height: 32px; }
            .app-header .profile-pic { width: 30px; height: 30px; }
            .post-card .post-title { font-size: 1.1rem; }
            .post-card .card-media img { max-height: 220px; }
            .full-post-overlay .full-post-content .full-title { font-size: 1.3rem; }
            .bottom-nav .nav-item i { font-size: 1.1rem; }
            .bottom-nav .nav-item.post-btn i { width: 40px; height: 40px; font-size: 1.6rem; margin-top: -12px; }
        }
        @media (min-width: 768px) {
            .feed { padding: 10px 24px 30px; }
            .post-card .card-media img { max-height: 400px; }
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #f0ebe4; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 10px; }

        .hidden { display: none; }
    </style>
</head>

    <!-- HEADER -->
    <header class="app-header">

            <div class="brand-text">
                <span class="main">BUHWEJU MUST DEVELOP</span>
                <span class="sub">Ordinary people's voice</span>
            </div>
        </div>
        <div class="right">
            <i class="fas fa-search search-icon" id="searchToggle"></i>
            <img class="profile-pic" id="headerProfilePic" src="https://res.cloudinary.com/dp81zzxlh/image/upload/v1/default-avatar.png" alt="Profile" />
        </div>
    </header>

    <!-- MOVING AD -->
    <div class="marquee-ad">
        <div class="marquee-track">
            <span><i class="fas fa-microphone-alt"></i> App designed by Dr Byamukama Mentor, expert in ICT.</span>
            <span><i class="fas fa-microphone-alt"></i> App designed by Dr Byamukama Mentor, expert in ICT.</span>
            <span><i class="fas fa-microphone-alt"></i> App designed by Dr Byamukama Mentor, expert in ICT.</span>
            <span><i class="fas fa-microphone-alt"></i> App designed by Dr Byamukama Mentor, expert in ICT.</span>
        </div>
    </div>

    <!-- SEARCH OVERLAY -->
    <div class="search-overlay" id="searchOverlay">
        <div class="search-box">
            <div class="close-btn" id="searchClose"><i class="fas fa-times"></i></div>
            <input type="text" id="searchInput" placeholder="Search posts..." autofocus />
            <div class="results" id="searchResults"></div>
        </div>
    </div>

    <!-- FEED -->
    <main class="feed" id="feedContainer">
        <div id="postsWrapper">
            <!-- skeletons will be shown initially -->
        </div>
    </main>

    <!-- FULL POST OVERLAY -->
    <div class="full-post-overlay" id="fullPostOverlay">
        <div class="full-post-content" id="fullPostContent">
            <div class="close-full" id="fullPostClose"><i class="fas fa-times"></i></div>
            <div id="fullPostBody"></div>
        </div>
    </div>

    <!-- SHARE MODAL -->
    <div class="share-modal" id="shareModal">
        <div class="share-box">
            <h3><i class="fas fa-share-alt" style="color:var(--bmd-gold);"></i> Share via</h3>
            <div class="share-grid" id="shareGrid">
                <!-- dynamic -->
            </div>
            <button class="close-share" id="closeShareBtn">Cancel</button>
        </div>
    </div>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
        <button class="nav-item active" data-tab="home"><i class="fas fa-home"></i><span class="label">Home</span></button>
        <button class="nav-item" data-tab="register"><i class="fas fa-user-plus"></i><span class="label">Register</span></button>
        <button class="nav-item post-btn" data-tab="post"><i class="fas fa-plus"></i><span class="label">Post</span></button>
        <button class="nav-item" data-tab="activities"><i class="fas fa-calendar-alt"></i><span class="label">Activities</span></button>
        <button class="nav-item" data-tab="account"><i class="fas fa-user-circle"></i><span class="label">Account</span></button>
    </nav>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <!-- ============================================================ -->
    <!-- ======================== FIREBASE + APP ===================== -->
    <!-- ============================================================ -->
    <script>
        // ================================================================
        //  FIREBASE CONFIG (same as shared)
        // ================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyC-PINF2AJcETYIMINiCfT0gSxLxw70vSE",
            authDomain: "bmd-app-1aec8.firebaseapp.com",
            projectId: "bmd-app-1aec8",
            storageBucket: "bmd-app-1aec8.firebasestorage.app",
            messagingSenderId: "722780031230",
            appId: "1:722780031230:web:cd19a98e24e4d9d80dfdaf",
            measurementId: "G-WPEG8SQSW7"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // ================================================================
        //  STATE
        // ================================================================
        let allPosts = [];
        let currentUser = null;
        let likedPosts = new Set();
        let currentSharePostId = null;

        // ================================================================
        //  DOM REFS
        // ================================================================
        const postsWrapper = document.getElementById('postsWrapper');
        const searchOverlay = document.getElementById('searchOverlay');
        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');
        const searchToggle = document.getElementById('searchToggle');
        const searchClose = document.getElementById('searchClose');
        const fullPostOverlay = document.getElementById('fullPostOverlay');
        const fullPostBody = document.getElementById('fullPostBody');
        const fullPostClose = document.getElementById('fullPostClose');
        const shareModal = document.getElementById('shareModal');
        const shareGrid = document.getElementById('shareGrid');
        const closeShareBtn = document.getElementById('closeShareBtn');
        const toast = document.getElementById('toast');
        const headerProfilePic = document.getElementById('headerProfilePic');

        // ================================================================
        //  TOAST
        // ================================================================
        let toastTimer = null;
        function showToast(msg, duration = 2500) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), duration);
        }

        // ================================================================
        //  AUTH
        // ================================================================
        auth.onAuthStateChanged(user => {
            currentUser = user;
            if (user) {
                // update profile pic
                if (user.photoURL) headerProfilePic.src = user.photoURL;
                else {
                    db.collection('users').doc(user.uid).get().then(doc => {
                        if (doc.exists && doc.data().photoURL) headerProfilePic.src = doc.data().photoURL;
                    });
                }
                // load liked posts
                db.collection('likes').where('userId', '==', user.uid).get()
                    .then(snap => { snap.forEach(d => likedPosts.add(d.data().postId)); renderPosts(allPosts); })
                    .catch(() => {});
            } else {
                likedPosts.clear();
                headerProfilePic.src = 'https://res.cloudinary.com/dp81zzxlh/image/upload/v1/default-avatar.png';
                renderPosts(allPosts);
            }
        });

        // ================================================================
        //  FETCH POSTS (real-time)
        // ================================================================
        function listenPosts() {
            db.collection('posts').orderBy('createdAt', 'desc')
                .onSnapshot(snapshot => {
                    const posts = [];
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        posts.push({ id: doc.id, ...data, createdAt: data.createdAt ? data.createdAt.toDate() : new Date() });
                    });
                    allPosts = posts;
                    renderPosts(posts);
                }, err => { console.error(err); showToast('Error loading posts.'); });
        }

        // ================================================================
        //  RENDER POSTS
        // ================================================================
        function renderPosts(posts) {
            if (!posts || posts.length === 0) {
                postsWrapper.innerHTML = `<div class="empty-state"><i class="fas fa-newspaper"></i><h3>No posts yet</h3><p>Be the first to share your voice!</p></div>`;
                return;
            }

            let html = '';
            posts.forEach(post => {
                const isLiked = likedPosts.has(post.id);
                const likeCount = post.likes || 0;
                const previewText = post.preview || post.content?.slice(0, 150) || '';
                const authorName = post.authorName || 'Anonymous';
                const dateStr = post.createdAt ? formatDate(post.createdAt) : '';

                // media
                let mediaHtml = '';
                if (post.imageUrl) {
                    mediaHtml += `<div class="card-media"><img src="${post.imageUrl}" alt="${post.title || 'image'}" loading="lazy" /></div>`;
                }
                if (post.audioUrl) {
                    mediaHtml += `<div class="media-player"><audio controls preload="metadata"><source src="${post.audioUrl}" type="audio/mpeg" /></audio></div>`;
                }
                if (post.videoUrl) {
                    mediaHtml += `<div class="media-player"><video controls preload="metadata" style="width:100%;max-height:260px;"><source src="${post.videoUrl}" type="video/mp4" /></video></div>`;
                }

                html += `
                    <div class="post-card" data-postid="${post.id}">
                        <div class="card-body">
                            <div class="post-author">
                                <i class="fas fa-user-circle"></i>
                                <span class="name">${escapeHtml(authorName)}</span>
                                ${dateStr ? `<span class="date">• ${dateStr}</span>` : ''}
                            </div>
                            <div class="post-title">${escapeHtml(post.title || 'Untitled')}</div>
                            ${mediaHtml}
                            <div class="post-preview">${escapeHtml(previewText)}</div>
                        </div>
                        <div class="post-actions">
                            <div class="left">
                                <button class="action-btn like-btn ${isLiked ? 'liked' : ''}" data-postid="${post.id}">
                                    <i class="${isLiked ? 'fas' : 'far'} fa-heart"></i>
                                    <span class="count">${likeCount}</span>
                                </button>
                                <button class="action-btn share-btn" data-postid="${post.id}">
                                    <i class="fas fa-share-alt"></i>
                                </button>
                            </div>
                            <button class="read-more" data-postid="${post.id}">Read More →</button>
                        </div>
                    </div>
                `;
            });

            postsWrapper.innerHTML = html;

            // attach events
            document.querySelectorAll('.post-card').forEach(card => {
                const pid = card.dataset.postid;
                card.addEventListener('click', (e) => {
                    if (e.target.closest('.post-actions') || e.target.closest('.media-player') ||
                        e.target.tagName === 'BUTTON' || e.target.tagName === 'AUDIO' || e.target.tagName === 'VIDEO' || e.target.tagName === 'SOURCE') return;
                    openFullPost(pid);
                });
            });

            document.querySelectorAll('.like-btn').forEach(btn => {
                btn.addEventListener('click', (e) => { e.stopPropagation(); toggleLike(btn.dataset.postid); });
            });
            document.querySelectorAll('.share-btn').forEach(btn => {
                btn.addEventListener('click', (e) => { e.stopPropagation(); openShareModal(btn.dataset.postid); });
            });
            document.querySelectorAll('.read-more').forEach(btn => {
                btn.addEventListener('click', (e) => { e.stopPropagation(); openFullPost(btn.dataset.postid); });
            });
        }

        // ================================================================
        //  LIKE
        // ================================================================
        async function toggleLike(postId) {
            if (!currentUser) { showToast('Please sign in to like.'); return; }
            const post = allPosts.find(p => p.id === postId);
            if (!post) return;
            const isLiked = likedPosts.has(postId);
            const newCount = isLiked ? (post.likes || 1) - 1 : (post.likes || 0) + 1;
            try {
                await db.collection('posts').doc(postId).update({ likes: newCount });
                if (isLiked) {
                    const snap = await db.collection('likes').where('userId', '==', currentUser.uid).where('postId', '==', postId).get();
                    snap.forEach(d => d.ref.delete());
                    likedPosts.delete(postId);
                } else {
                    await db.collection('likes').add({ userId: currentUser.uid, postId, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
                    likedPosts.add(postId);
                }
                post.likes = newCount;
                renderPosts(allPosts);
            } catch (err) { showToast('Error updating like.'); }
        }

        // ================================================================
        //  SHARE MODAL
        // ================================================================
        function openShareModal(postId) {
            currentSharePostId = postId;
            const post = allPosts.find(p => p.id === postId);
            if (!post) return;
            const title = post.title || 'BMD Post';
            const preview = post.preview || post.content?.slice(0, 120) || '';
            const imageUrl = post.imageUrl || 'https://res.cloudinary.com/dp81zzxlh/image/upload/v1784978097/vhaafrigchmqnqbhehft.jpg';
            const baseUrl = window.location.origin + window.location.pathname;
            const params = new URLSearchParams();
            params.set('post', postId);
            params.set('t', encodeURIComponent(title));
            params.set('p', encodeURIComponent(preview));
            params.set('i', encodeURIComponent(imageUrl));
            const shareUrl = baseUrl + '?' + params.toString();

            const apps = [
                { name: 'WhatsApp', icon: 'fab fa-whatsapp', color: '#25D366', url: `https://api.whatsapp.com/send?text=${encodeURIComponent('📢 *' + title + '*\n\n' + preview + '…\n\n🔗 ' + shareUrl)}` },
                { name: 'WhatsApp Business', icon: 'fab fa-whatsapp', color: '#25D366', url: `https://api.whatsapp.com/send?text=${encodeURIComponent('📢 *' + title + '*\n\n' + preview + '…\n\n🔗 ' + shareUrl)}` },
                { name: 'TikTok', icon: 'fab fa-tiktok', color: '#000', url: `https://www.tiktok.com/` },
                { name: 'Telegram', icon: 'fab fa-telegram', color: '#26A5E4', url: `https://t.me/share/url?url=${encodeURIComponent(shareUrl)}&text=${encodeURIComponent('📢 ' + title)}` },
                { name: 'Twitter', icon: 'fab fa-twitter', color: '#1DA1F2', url: `https://twitter.com/intent/tweet?text=${encodeURIComponent('📢 ' + title + ' ' + shareUrl)}` },
                { name: 'Copy Link', icon: 'fas fa-link', color: '#555', url: '#' }
            ];

            shareGrid.innerHTML = apps.map(app => `
                <button style="background:${app.color};color:#fff;" data-url="${app.url}" data-copy="${app.name === 'Copy Link'}">
                    <i class="${app.icon}"></i> ${app.name}
                </button>
            `).join('');

            shareGrid.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', () => {
                    const url = btn.dataset.url;
                    if (btn.dataset.copy === 'true') {
                        navigator.clipboard.writeText(shareUrl).then(() => showToast('Link copied!')).catch(() => showToast('Copy failed.'));
                    } else {
                        window.open(url, '_blank');
                    }
                    shareModal.classList.remove('active');
                });
            });

            shareModal.classList.add('active');
            // update OG for preview
            updateOgMeta(title, preview, imageUrl, shareUrl);
        }

        closeShareBtn.addEventListener('click', () => shareModal.classList.remove('active'));
        shareModal.addEventListener('click', (e) => { if (e.target === shareModal) shareModal.classList.remove('active'); });

        // ================================================================
        //  OPEN FULL POST
        // ================================================================
        function openFullPost(postId) {
            const post = allPosts.find(p => p.id === postId);
            if (!post) { showToast('Post not found.'); return; }
            const authorName = post.authorName || 'Anonymous';
            const dateStr = post.createdAt ? formatDate(post.createdAt) : '';
            const content = post.content || post.preview || '';

            let mediaHtml = '';
            if (post.imageUrl) mediaHtml += `<img class="full-image" src="${post.imageUrl}" alt="${post.title || 'image'}" />`;
            if (post.audioUrl) mediaHtml += `<div class="full-media"><audio controls preload="metadata" style="width:100%;"><source src="${post.audioUrl}" type="audio/mpeg" /></audio></div>`;
            if (post.videoUrl) mediaHtml += `<div class="full-media"><video controls preload="metadata" style="width:100%;max-height:360px;"><source src="${post.videoUrl}" type="video/mp4" /></video></div>`;

            const isLiked = likedPosts.has(post.id);
            const likeCount = post.likes || 0;

            fullPostBody.innerHTML = `
                <div class="full-title">${escapeHtml(post.title || 'Untitled')}</div>
                <div class="full-meta"><i class="fas fa-user-circle"></i> ${escapeHtml(authorName)} ${dateStr ? '• ' + dateStr : ''}</div>
                ${mediaHtml}
                <div class="full-text">${escapeHtml(content)}</div>
                <div class="full-actions">
                    <button class="action-btn like-btn ${isLiked ? 'liked' : ''}" data-postid="${post.id}" style="display:flex;align-items:center;gap:4px;font-size:0.9rem;background:none;border:none;cursor:pointer;font-family:inherit;padding:4px 10px;border-radius:20px;">
                        <i class="${isLiked ? 'fas' : 'far'} fa-heart"></i> <span class="count">${likeCount}</span>
                    </button>
                    <button class="action-btn share-btn" data-postid="${post.id}" style="display:flex;align-items:center;gap:4px;font-size:0.9rem;background:none;border:none;cursor:pointer;font-family:inherit;padding:4px 10px;border-radius:20px;color:#25D366;">
                        <i class="fas fa-share-alt"></i> Share
                    </button>
                    <button style="margin-left:auto;background:none;border:none;color:#888;cursor:pointer;font-size:0.8rem;" id="fullPostCloseBtn2"><i class="fas fa-times"></i> Close</button>
                </div>
            `;

            fullPostOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';

            fullPostBody.querySelector('.like-btn')?.addEventListener('click', (e) => {
                e.stopPropagation();
                const pid = e.currentTarget.dataset.postid;
                toggleLike(pid);
                setTimeout(() => openFullPost(pid), 300);
            });
            fullPostBody.querySelector('.share-btn')?.addEventListener('click', (e) => {
                e.stopPropagation();
                openShareModal(post.id);
            });
            fullPostBody.querySelector('#fullPostCloseBtn2')?.addEventListener('click', closeFullPost);
        }

        function closeFullPost() {
            fullPostOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        // ================================================================
        //  SEARCH
        // ================================================================
        searchToggle.addEventListener('click', () => { searchOverlay.classList.add('active'); searchInput.value = ''; searchResults.innerHTML = ''; searchInput.focus(); });
        searchClose.addEventListener('click', () => searchOverlay.classList.remove('active'));
        searchOverlay.addEventListener('click', (e) => { if (e.target === searchOverlay) searchOverlay.classList.remove('active'); });

        searchInput.addEventListener('input', (e) => {
            const q = e.target.value.trim().toLowerCase();
            if (!q) { searchResults.innerHTML = ''; return; }
            const matches = allPosts.filter(p => (p.title||'').toLowerCase().includes(q) || (p.content||'').toLowerCase().includes(q) || (p.preview||'').toLowerCase().includes(q) || (p.authorName||'').toLowerCase().includes(q));
            if (!matches.length) { searchResults.innerHTML = '<div class="empty">No posts found.</div>'; return; }
            let html = '';
            matches.slice(0, 12).forEach(p => {
                const img = p.imageUrl || 'https://res.cloudinary.com/dp81zzxlh/image/upload/v1784978097/vhaafrigchmqnqbhehft.jpg';
                html += `<div class="result-item" data-postid="${p.id}"><img src="${img}" alt="" /><div class="info"><div class="title">${escapeHtml(p.title||'Untitled')}</div><div class="preview">${escapeHtml((p.preview||p.content||'').slice(0,80))}…</div></div></div>`;
            });
            searchResults.innerHTML = html;
            searchResults.querySelectorAll('.result-item').forEach(el => {
                el.addEventListener('click', () => { const pid = el.dataset.postid; searchOverlay.classList.remove('active'); openFullPost(pid); });
            });
        });

        // ================================================================
        //  FULL POST CLOSE
        // ================================================================
        fullPostClose.addEventListener('click', closeFullPost);
        fullPostOverlay.addEventListener('click', (e) => { if (e.target === fullPostOverlay) closeFullPost(); });

        // ================================================================
        //  OG META UPDATE
        // ================================================================
        function updateOgMeta(title, description, image, url) {
            let m = document.querySelector('meta[property="og:title"]');
            if (m) m.setAttribute('content', title + ' – BMD');
            else { m = document.createElement('meta'); m.setAttribute('property','og:title'); m.setAttribute('content', title + ' – BMD'); document.head.appendChild(m); }
            m = document.querySelector('meta[property="og:description"]');
            if (m) m.setAttribute('content', description);
            else { m = document.createElement('meta'); m.setAttribute('property','og:description'); m.setAttribute('content', description); document.head.appendChild(m); }
            m = document.querySelector('meta[property="og:image"]');
            if (m) m.setAttribute('content', image);
            else { m = document.createElement('meta'); m.setAttribute('property','og:image'); m.setAttribute('content', image); document.head.appendChild(m); }
            m = document.querySelector('meta[property="og:url"]');
            if (m) m.setAttribute('content', url);
            else { m = document.createElement('meta'); m.setAttribute('property','og:url'); m.setAttribute('content', url); document.head.appendChild(m); }
        }

        // ================================================================
        //  UTILITY
        // ================================================================
        function escapeHtml(t) { if (!t) return ''; const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
        function formatDate(d) {
            if (!d) return '';
            const diff = Date.now() - d.getTime();
            if (diff < 60000) return 'Just now';
            if (diff < 3600000) return Math.floor(diff/60000) + 'm ago';
            if (diff < 86400000) return Math.floor(diff/3600000) + 'h ago';
            if (diff < 172800000) return 'Yesterday';
            return d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
        }

        function handleUrlParams() {
            const params = new URLSearchParams(window.location.search);
            const pid = params.get('post');
            if (pid) {
                const check = setInterval(() => {
                    if (allPosts.length > 0) {
                        clearInterval(check);
                        const p = allPosts.find(x => x.id === pid);
                        if (p) openFullPost(pid);
                        else showToast('Post not found.');
                    }
                }, 300);
                const t = params.get('t'), pr = params.get('p'), img = params.get('i');
                if (t && pr && img) updateOgMeta(decodeURIComponent(t), decodeURIComponent(pr), decodeURIComponent(img), window.location.href);
            }
        }

        // ================================================================
        //  BOTTOM NAV
        // ================================================================
        document.querySelectorAll('.bottom-nav .nav-item').forEach(item => {
            item.addEventListener('click', () => {
                const tab = item.dataset.tab;
                document.querySelectorAll('.bottom-nav .nav-item').forEach(n => n.classList.remove('active'));
                item.classList.add('active');
                switch(tab) {
                    case 'home': window.scrollTo({ top:0, behavior:'smooth' }); break;
                    case 'register': showToast('📝 Register page coming soon!'); break;
                    case 'activities': showToast('📅 Activities page coming soon!'); break;
                    case 'post': window.location.href = 'post.html'; break;
                    case 'account': window.location.href = 'account.html'; break;
                    default: break;
                }
            });
        });

        // ================================================================
        //  INIT
        // ================================================================
        // show skeletons while loading
        postsWrapper.innerHTML = `
            <div class="skeleton"><div class="s-image"></div><div class="s-line med"></div><div class="s-line"></div><div class="s-line short"></div></div>
            <div class="skeleton"><div class="s-image"></div><div class="s-line med"></div><div class="s-line"></div><div class="s-line short"></div></div>
        `;

        listenPosts();
        setTimeout(handleUrlParams, 600);
        window.addEventListener('popstate', handleUrlParams);

        // header profile click -> account
        headerProfilePic.addEventListener('click', () => window.location.href = 'account.html');

        console.log('🚀 BMD App (updated) loaded.');
    </script>
</body>
</html>
