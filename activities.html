<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Activities – BMD</title>

    <!-- ===== FIREBASE SDK ===== -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js">
    </script>

    <!-- ===== FONTS & ICONS ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />

    <!-- ===== EXTERNAL STYLES ===== -->
    <link rel="stylesheet" href="index-style.css" />

    <style>
        /* ===== ACTIVITIES PUBLIC STYLES ===== */
        .activities-container {
            max-width: 720px;
            margin: 0 auto;
            padding: 8px 16px 20px;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding: 12px 16px;
            background: #ffffff;
            border-radius: var(--radius-lg, 18px);
            box-shadow: var(--shadow-sm, 0 2px 8px rgba(0,0,0,0.05));
            border: 1px solid var(--border-color, #e5e7eb);
        }

        .page-header .title {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary, #1f2937);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-header .title i {
            color: var(--accent-gold, #d4a743);
        }

        .page-header .activity-count {
            font-size: 0.8rem;
            color: #888;
            background: #f3f4f6;
            padding: 4px 12px;
            border-radius: 20px;
        }

        /* ===== ACTIVITY CARD ===== */
        .activity-card {
            background: #ffffff;
            border-radius: var(--radius-lg, 18px);
            margin-bottom: 16px;
            box-shadow: var(--shadow-sm, 0 2px 8px rgba(0,0,0,0.05));
            border: 1px solid var(--border-color, #e5e7eb);
            overflow: hidden;
            transition: box-shadow 0.2s ease, transform 0.15s ease;
            cursor: default;
        }

        .activity-card:hover {
            box-shadow: var(--shadow-md, 0 6px 20px rgba(0,0,0,0.08));
        }

        .activity-card .activity-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: #e8e0d4;
            display: block;
        }

        .activity-card .activity-image-placeholder {
            width: 100%;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #f0ebe4, #e8e0d4);
            color: #999;
            font-size: 3rem;
        }

        .activity-card .activity-body {
            padding: 16px;
        }

        .activity-card .activity-title {
            font-family: 'Lora', serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-primary, #1f2937);
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .activity-card .activity-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 18px;
            font-size: 0.78rem;
            color: #888;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid #f3f4f6;
        }

        .activity-card .activity-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .activity-card .activity-meta i {
            color: var(--accent-gold, #d4a743);
            width: 16px;
        }

        .activity-card .activity-type-badge {
            display: inline-block;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 2px 12px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .activity-card .activity-type-badge.meeting {
            background: #e3f2fd;
            color: #1565c0;
        }
        .activity-card .activity-type-badge.sports {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .activity-card .activity-type-badge.workshop {
            background: #fff3e0;
            color: #e65100;
        }
        .activity-card .activity-type-badge.community {
            background: #fce4ec;
            color: #c62828;
        }
        .activity-card .activity-type-badge.fundraising {
            background: #f3e5f5;
            color: #6a1b9a;
        }
        .activity-card .activity-type-badge.other {
            background: #f5f5f5;
            color: #616161;
        }

        .activity-card .activity-desc {
            font-size: 0.88rem;
            line-height: 1.6;
            color: #444;
            margin-top: 6px;
        }

        .activity-card .activity-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px 14px;
            border-top: 1px solid #f3f4f6;
            background: #fafafa;
            flex-wrap: wrap;
            gap: 8px;
        }

        .activity-card .activity-footer .contact-info {
            font-size: 0.75rem;
            color: #888;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .activity-card .activity-footer .contact-info i {
            color: var(--accent-gold, #d4a743);
        }

        .activity-card .activity-footer .share-btn {
            background: var(--accent-gold, #d4a743);
            color: #111827;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s, transform 0.15s;
        }

        .activity-card .activity-footer .share-btn:active {
            transform: scale(0.95);
        }

        .activity-card .activity-footer .share-btn:hover {
            background: var(--accent-gold-hover, #f0d080);
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
            background: #ffffff;
            border-radius: var(--radius-lg, 18px);
            border: 1px solid var(--border-color, #e5e7eb);
        }

        .empty-state i {
            font-size: 3rem;
            color: #ccc;
            margin-bottom: 12px;
        }

        .empty-state h3 {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 4px;
        }

        .empty-state p {
            font-size: 0.85rem;
            color: #999;
        }

        /* ===== SKELETON ===== */
        .skeleton {
            background: #e8e0d4;
            border-radius: var(--radius-lg);
            padding: 16px;
            margin-bottom: 16px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .skeleton .skeleton-image {
            height: 180px;
            background: #d5cdc0;
            border-radius: var(--radius-sm);
            margin-bottom: 12px;
        }

        .skeleton .skeleton-line {
            height: 14px;
            background: #d5cdc0;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .skeleton .skeleton-line.short {
            width: 60%;
        }
        .skeleton .skeleton-line.med {
            width: 80%;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #111827;
            color: #fff;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.8rem;
            opacity: 0;
            transition: all 0.3s;
            z-index: 5000;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .activities-container {
                padding: 6px 10px 12px;
            }
            .page-header {
                flex-direction: column;
                gap: 6px;
                text-align: center;
            }
            .page-header .title {
                font-size: 1rem;
            }
            .activity-card .activity-image {
                height: 160px;
            }
            .activity-card .activity-image-placeholder {
                height: 160px;
            }
            .activity-card .activity-title {
                font-size: 1rem;
            }
            .activity-card .activity-meta {
                font-size: 0.7rem;
                gap: 8px 12px;
            }
            .activity-card .activity-footer {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
        }

        @media (min-width: 768px) {
            .activities-container {
                padding: 12px 24px 30px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER (white, centered - same as index) ===== -->
    <header class="app-header">
        <div class="header-center">
            <img src="https://res.cloudinary.com/dp81zzxlh/image/upload/v1784978097/vhaafrigchmqnqbhehft.jpg" alt="BMD Logo" class="header-logo" />
            <div class="brand-info">
                <h1>BUHWEJU MUST DEVELOP</h1>
                <span class="sub">Eiraka ryabantu baburijo.</span>
            </div>
        </div>
        <div class="header-right">
            <button class="header-action-btn" id="searchToggle" aria-label="Search" style="display:none;">
                <i class="fas fa-search"></i>
            </button>
            <a href="account.html" id="userProfileLink">
                <div class="user-profile-avatar" id="headerAvatar">
                    <i class="fas fa-user"></i>
                </div>
            </a>
        </div>
    </header>

    <!-- ===== MOVING AD ===== -->
    <div class="marquee-ad">
        <div class="marquee-track">
            <span><i class="fas fa-bullhorn"></i> App designed by Dr Byamukama Mentor, expert in ICT.</span>
            <span><i class="fas fa-bullhorn"></i> App designed by Dr Byamukama Mentor, expert in ICT.</span>
            <span><i class="fas fa-bullhorn"></i> App designed by Dr Byamukama Mentor, expert in ICT.</span>
        </div>
    </div>

    <!-- ===== MAIN ===== -->
    <main class="activities-container">

        <!-- Page Header -->
        <div class="page-header">
            <div class="title">
                <i class="fas fa-calendar-alt"></i> Activities & Events
            </div>
            <div class="activity-count" id="activityCount">0 activities</div>
        </div>

        <!-- Activities Feed -->
        <div id="activitiesFeed">
            <!-- Loading skeleton -->
            <div class="skeleton">
                <div class="skeleton-image"></div>
                <div class="skeleton-line med"></div>
                <div class="skeleton-line"></div>
                <div class="skeleton-line short"></div>
            </div>
            <div class="skeleton">
                <div class="skeleton-image"></div>
                <div class="skeleton-line med"></div>
                <div class="skeleton-line"></div>
                <div class="skeleton-line short"></div>
            </div>
        </div>
    </main>

    <!-- ===== BOTTOM NAV (same as index) ===== -->
    <nav class="bottom-nav">
        <button class="nav-item" data-tab="home" id="navHome">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </button>
        <button class="nav-item" data-tab="register" id="navRegister">
            <i class="fas fa-user-plus"></i>
            <span>Register</span>
        </button>
        <button class="nav-item post-btn" data-tab="post" id="navPost">
            <i class="fas fa-plus"></i>
            <span style="margin-top:2px;">Post</span>
        </button>
        <button class="nav-item active" data-tab="activities" id="navActivities">
            <i class="fas fa-calendar-alt"></i>
            <span>Activities</span>
        </button>
        <button class="nav-item" data-tab="account" id="navAccount">
            <i class="fas fa-user-circle"></i>
            <span>Account</span>
        </button>
    </nav>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast"></div>

    <!-- ============================================================ -->
    <!-- ===== FIREBASE + APP LOGIC ===== -->
    <!-- ============================================================ -->
    <script>
        // ================================================================
        //  FIREBASE CONFIG
        // ================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyC-PINF2AJcETYIMINiCfT0gSxLxw70vSE",
            authDomain: "bmd-app-1aec8.firebaseapp.com",
            projectId: "bmd-app-1aec8",
            storageBucket: "bmd-app-1aec8.firebasestorage.app",
            messagingSenderId: "722780031230",
            appId: "1:722780031230:web:cd19a98e24e4d9d80dfdaf",
            measurementId: "G-WPEG8SQSW7"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const db = firebase.firestore();
        const auth = firebase.auth();

        // ================================================================
        //  DOM REFS
        // ================================================================
        const activitiesFeed = document.getElementById('activitiesFeed');
        const activityCount = document.getElementById('activityCount');
        const headerAvatar = document.getElementById('headerAvatar');
        const toast = document.getElementById('toast');

        // ================================================================
        //  TOAST
        // ================================================================
        let toastTimer = null;

        function showToast(msg, duration = 2800) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), duration);
        }

        // ================================================================
        //  AUTH STATE LISTENER
        // ================================================================
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                try {
                    const userDoc = await db.collection('users').doc(user.uid).get();
                    if (userDoc.exists && userDoc.data().photoURL) {
                        headerAvatar.innerHTML = `<img src="${userDoc.data().photoURL}" style="width:100%;height:100%;object-fit:cover;" />`;
                    } else if (user.photoURL) {
                        headerAvatar.innerHTML = `<img src="${user.photoURL}" style="width:100%;height:100%;object-fit:cover;" />`;
                    }
                } catch (e) {
                    console.error("Error fetching user profile:", e);
                }
            }
        });

        // ================================================================
        //  LOAD ACTIVITIES (Real-time)
        // ================================================================
        function loadActivities() {
            db.collection('activities')
                .orderBy('createdAt', 'desc')
                .onSnapshot(snapshot => {
                    const activities = [];
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        activities.push({
                            id: doc.id,
                            ...data,
                            createdAt: data.createdAt ? data.createdAt.toDate() : new Date()
                        });
                    });
                    renderActivities(activities);
                }, error => {
                    console.error('Error loading activities:', error);
                    showToast('Error loading activities. Please refresh.', 3000);
                    activitiesFeed.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-triangle"></i>
                            <h3>Error Loading Activities</h3>
                            <p>Please refresh the page to try again.</p>
                        </div>
                    `;
                });
        }

        // ================================================================
        //  RENDER ACTIVITIES
        // ================================================================
        function renderActivities(activities) {
            activityCount.textContent = activities.length + ' activity' + (activities.length !== 1 ? 's' : '');

            if (!activities.length) {
                activitiesFeed.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-calendar-alt"></i>
                        <h3>No Activities Yet</h3>
                        <p>Check back soon for community events and activities.</p>
                    </div>
                `;
                return;
            }

            let html = '';
            activities.forEach(activity => {
                const dateStr = activity.date ? new Date(activity.date + 'T' + (activity.time || '00:00')).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }) : 'N/A';
                const timeStr = activity.time || 'N/A';

                // Image
                let imageHtml = '';
                if (activity.imageUrl) {
                    imageHtml = `<img src="${activity.imageUrl}" alt="${activity.title}" class="activity-image" loading="lazy" />`;
                } else {
                    imageHtml = `<div class="activity-image-placeholder"><i class="fas fa-calendar-alt"></i></div>`;
                }

                // Type badge class
                const typeClass = activity.type || 'other';
                const typeLabels = {
                    'meeting': 'Meeting',
                    'sports': 'Sports',
                    'workshop': 'Workshop',
                    'community': 'Community Event',
                    'fundraising': 'Fundraising',
                    'other': 'Other'
                };
                const typeLabel = typeLabels[activity.type] || 'Other';

                // Format description (convert line breaks)
                const description = activity.description ? activity.description.replace(/\n/g, '<br />') : '';

                html += `
                    <div class="activity-card" data-id="${activity.id}">
                        ${imageHtml}
                        <div class="activity-body">
                            <div class="activity-title">${escapeHtml(activity.title)}</div>
                            <div class="activity-meta">
                                <span><i class="fas fa-calendar-day"></i> ${escapeHtml(dateStr)}</span>
                                <span><i class="fas fa-clock"></i> ${escapeHtml(timeStr)}</span>
                                <span><i class="fas fa-map-marker-alt"></i> ${escapeHtml(activity.location)}</span>
                                <span>
                                    <span class="activity-type-badge ${typeClass}">${escapeHtml(typeLabel)}</span>
                                </span>
                            </div>
                            <div class="activity-desc">${description}</div>
                        </div>
                        <div class="activity-footer">
                            ${activity.contact ? `<div class="contact-info"><i class="fas fa-user"></i> Contact: ${escapeHtml(activity.contact)}</div>` : ''}
                            <button class="share-btn" onclick="shareActivity('${activity.id}')">
                                <i class="fas fa-share-alt"></i> Share
                            </button>
                        </div>
                    </div>
                `;
            });

            activitiesFeed.innerHTML = html;
        }

        // ================================================================
        //  SHARE ACTIVITY
        // ================================================================
        function shareActivity(activityId) {
            const activity = allActivities.find(a => a.id === activityId);
            if (!activity) {
                showToast('Activity not found.', 2000);
                return;
            }

            const title = activity.title || 'BMD Activity';
            const description = activity.description || '';
            const date = activity.date || '';
            const time = activity.time || '';
            const location = activity.location || '';
            const imageUrl = activity.imageUrl || 'https://res.cloudinary.com/dp81zzxlh/image/upload/v1784978097/vhaafrigchmqnqbhehft.jpg';

            // Build share text
            const shareText = `📅 *${title}*\n\n📝 ${description}\n\n📆 Date: ${date}\n🕐 Time: ${time}\n📍 Location: ${location}\n\n#BMD #BuhwejuMustDevelop #Community`;

            // Build share URL with activity details
            const shareUrl = `${window.location.origin}${window.location.pathname}?activity=${activityId}`;

            // Open WhatsApp
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(shareText + '\n\n🔗 ' + shareUrl)}`, '_blank');
        }

        // ================================================================
        //  NAVIGATION
        // ================================================================
        document.querySelectorAll('.bottom-nav .nav-item').forEach(item => {
            item.addEventListener('click', () => {
                const tab = item.dataset.tab;
                document.querySelectorAll('.bottom-nav .nav-item').forEach(n => n.classList.remove('active'));
                item.classList.add('active');

                switch (tab) {
                    case 'home':
                        window.location.href = 'index.html';
                        break;
                    case 'register':
                        window.location.href = 'register.html';
                        break;
                    case 'post':
                        window.location.href = 'post.html';
                        break;
                    case 'activities':
                        break;
                    case 'account':
                        window.location.href = 'account.html';
                        break;
                    default:
                        break;
                }
            });
        });

        // Header avatar click -> account
        headerAvatar.addEventListener('click', () => {
            window.location.href = 'account.html';
        });

        // ================================================================
        //  UTILITY
        // ================================================================
        function escapeHtml(str) {
            return String(str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        // ================================================================
        //  STORE ACTIVITIES FOR SHARING
        // ================================================================
        let allActivities = [];

        // Override renderActivities to store activities
        const originalRender = renderActivities;
        renderActivities = function(activities) {
            allActivities = activities;
            originalRender(activities);
        };

        // ================================================================
        //  INIT
        // ================================================================
        loadActivities();
        console.log('📅 BMD Public Activities page loaded.');
    </script>

</body>
</html>
